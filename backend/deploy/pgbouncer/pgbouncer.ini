[databases]
identity = host=postgres port=5432 dbname=carboncircuit user=identity_service password=identity_service pool_size=20
billing = host=postgres port=5432 dbname=carboncircuit user=billing_service password=billing_service pool_size=20
provenance = host=postgres port=5432 dbname=carboncircuit user=provenance_service password=provenance_service pool_size=20

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
reserve_pool_size = 5
server_reset_query =
ignore_startup_parameters = extra_float_digits,search_path,options
admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
