syntax = "proto3";

package carboncircuit.identity.v1;

option go_package = "github.com/carboncircuit/backend/gen/carboncircuit/identity/v1;identityv1";

service IdentityService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ResolveSession(ResolveSessionRequest) returns (ResolveSessionResponse);
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc IssueTreasuryNonce(IssueTreasuryNonceRequest) returns (IssueTreasuryNonceResponse);
  rpc DesignateTreasury(DesignateTreasuryRequest) returns (DesignateTreasuryResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc ChangeMemberRole(ChangeMemberRoleRequest) returns (ChangeMemberRoleResponse);
  rpc RevokeMember(RevokeMemberRequest) returns (RevokeMemberResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc CreateFacility(CreateFacilityRequest) returns (CreateFacilityResponse);
  rpc ListFacilities(ListFacilitiesRequest) returns (ListFacilitiesResponse);
  rpc GetFacility(GetFacilityRequest) returns (GetFacilityResponse);
}

enum OrganizationType {
  ORGANIZATION_TYPE_UNSPECIFIED = 0;
  ORGANIZATION_TYPE_MANUFACTURER = 1;
  ORGANIZATION_TYPE_ASSEMBLER = 2;
  ORGANIZATION_TYPE_LOGISTICS = 3;
  ORGANIZATION_TYPE_CREDIT_BUYER = 4;
}

enum OrganizationRole {
  ORGANIZATION_ROLE_UNSPECIFIED = 0;
  ORGANIZATION_ROLE_OWNER = 1;
  ORGANIZATION_ROLE_ADMIN = 2;
  ORGANIZATION_ROLE_MEMBER = 3;
}

enum OrganizationState {
  ORGANIZATION_STATE_UNSPECIFIED = 0;
  ORGANIZATION_STATE_ACTIVE = 1;
  ORGANIZATION_STATE_RESTRICTED = 2;
  ORGANIZATION_STATE_READ_ONLY = 3;
  ORGANIZATION_STATE_SUSPENDED = 4;
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_VERIFIED = 1;
  VERIFICATION_STATUS_UNVERIFIED = 2;
  VERIFICATION_STATUS_REJECTED = 3;
}

enum PlatformRole {
  PLATFORM_ROLE_UNSPECIFIED = 0;
  PLATFORM_ROLE_VERIFIER = 1;
  PLATFORM_ROLE_PLATFORM_ADMIN = 2;
}

message PingRequest {}

message PingResponse {
  string service = 1;
  string revision = 2;
  bool database_reachable = 3;
}

message ResolveSessionRequest {
  string auth0_subject = 1;
  string email = 2;
  bool email_verified = 3;
  string name = 4;
}

message SessionUser {
  string id = 1;
  string email = 2;
  string name = 3;
  PlatformRole platform_role = 4;
  bool mfa_enrolled = 5;
}

message SessionOrganization {
  string id = 1;
  string name = 2;
  OrganizationType type = 3;
  OrganizationState state = 4;
  VerificationStatus verification_status = 5;
  bool treasury_designated = 6;
}

message ResolveSessionResponse {
  SessionUser user = 1;
  bool needs_onboarding = 2;
  SessionOrganization organization = 3;
  OrganizationRole role = 4;
}

enum ProductCategory {
  PRODUCT_CATEGORY_UNSPECIFIED = 0;
  PRODUCT_CATEGORY_ELECTRONICS = 1;
  PRODUCT_CATEGORY_AGRICULTURE = 2;
  PRODUCT_CATEGORY_PHARMA = 3;
  PRODUCT_CATEGORY_TEXTILES = 4;
}

enum RegistryRejection {
  REGISTRY_REJECTION_UNSPECIFIED = 0;
  REGISTRY_REJECTION_ENTITY_DISSOLVED = 1;
  REGISTRY_REJECTION_SANCTIONS_FLAG = 2;
  REGISTRY_REJECTION_NAME_MISMATCH = 3;
}

message CreateOrganizationRequest {
  reserved 1;
  reserved "auth0_subject";
  string name = 2;
  OrganizationType type = 3;
  string country_of_incorporation = 4;
  string business_registration_number = 5;
  repeated ProductCategory product_categories = 6;
}

message VerificationOutcome {
  VerificationStatus status = 1;
  RegistryRejection rejection = 2;
  bool registry_match_found = 3;
  string name_similarity = 4;
  string registered_legal_name = 5;
}

message CreateOrganizationResponse {
  SessionOrganization organization = 1;
  OrganizationRole role = 2;
  VerificationOutcome outcome = 3;
}

message GetOrganizationRequest {}

message OrganizationDetail {
  string id = 1;
  string name = 2;
  OrganizationType type = 3;
  OrganizationState state = 4;
  VerificationStatus verification_status = 5;
  string country_of_incorporation = 6;
  string business_registration_number = 7;
  repeated ProductCategory product_categories = 8;
  bool treasury_designated = 9;
  string created_at = 10;
  string treasury_address = 11;
}

message GetOrganizationResponse {
  OrganizationDetail organization = 1;
  OrganizationRole role = 2;
  VerificationOutcome outcome = 3;
}

message IssueTreasuryNonceRequest {}

message IssueTreasuryNonceResponse {
  string nonce = 1;
  string domain = 2;
  string chain_id = 3;
  string issued_at = 4;
  string expires_at = 5;
}

message DesignateTreasuryRequest {
  string message = 1;
  string signature = 2;
}

message DesignateTreasuryResponse {
  string address = 1;
  string designated_at = 2;
}

enum InvitationState {
  INVITATION_STATE_UNSPECIFIED = 0;
  INVITATION_STATE_PENDING = 1;
  INVITATION_STATE_ACCEPTED = 2;
  INVITATION_STATE_REVOKED = 3;
  INVITATION_STATE_EXPIRED = 4;
}

message Member {
  string user_id = 1;
  string email = 2;
  string name = 3;
  OrganizationRole role = 4;
  bool mfa_enrolled = 5;
  string joined_at = 6;
  string last_active_at = 7;
}

message Invitation {
  string id = 1;
  string email = 2;
  OrganizationRole role = 3;
  InvitationState state = 4;
  string invited_at = 5;
  string expires_at = 6;
  string invited_by_name = 7;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
  repeated Invitation invitations = 2;
}

message InviteMemberRequest {
  string email = 1;
  OrganizationRole role = 2;
}

message InviteMemberResponse {
  Invitation invitation = 1;
  string token = 2;
}

message RevokeInvitationRequest {
  string invitation_id = 1;
}

message RevokeInvitationResponse {}

message ChangeMemberRoleRequest {
  string user_id = 1;
  OrganizationRole role = 2;
}

message ChangeMemberRoleResponse {
  Member member = 1;
  string affected_subject = 2;
}

message RevokeMemberRequest {
  string user_id = 1;
}

message RevokeMemberResponse {
  string affected_subject = 1;
}

message AcceptInvitationRequest {
  string token = 1;
}

message AcceptInvitationResponse {
  string organization_id = 1;
  string organization_name = 2;
  OrganizationRole role = 3;
}

enum FacilityType {
  FACILITY_TYPE_UNSPECIFIED = 0;
  FACILITY_TYPE_RAW_MATERIAL_PROCESSING = 1;
  FACILITY_TYPE_COMPONENT_FABRICATION = 2;
  FACILITY_TYPE_ASSEMBLY = 3;
  FACILITY_TYPE_DISTRIBUTION = 4;
}

enum FacilityVerification {
  FACILITY_VERIFICATION_UNSPECIFIED = 0;
  FACILITY_VERIFICATION_FACILITY_MATCHED = 1;
  FACILITY_VERIFICATION_ORGANIZATION_MATCHED = 2;
  FACILITY_VERIFICATION_SELF_DECLARED = 3;
}

enum TrustTier {
  TRUST_TIER_UNSPECIFIED = 0;
  TRUST_TIER_NEW = 1;
  TRUST_TIER_VERIFIED = 2;
  TRUST_TIER_TRUSTED = 3;
}

enum GridRegion {
  GRID_REGION_UNSPECIFIED = 0;
  GRID_REGION_US_CAISO = 1;
  GRID_REGION_US_ERCOT = 2;
  GRID_REGION_US_PJM = 3;
  GRID_REGION_US_MISO = 4;
  GRID_REGION_EU_DE = 5;
  GRID_REGION_EU_FR = 6;
  GRID_REGION_EU_PL = 7;
  GRID_REGION_UK = 8;
  GRID_REGION_CN_EAST = 9;
  GRID_REGION_CN_SOUTH = 10;
  GRID_REGION_IN_NORTH = 11;
  GRID_REGION_JP = 12;
  GRID_REGION_KR = 13;
  GRID_REGION_TW = 14;
  GRID_REGION_VN = 15;
  GRID_REGION_MY = 16;
  GRID_REGION_SG = 17;
  GRID_REGION_TH = 18;
}

message Facility {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string address = 4;
  string country_code = 5;
  GridRegion grid_region = 6;
  FacilityType type = 7;
  string facility_reference = 8;
  FacilityVerification verification_status = 9;
  string ceiling_discount_factor = 10;
  TrustTier trust_tier = 11;
  string declared_capacity = 12;
  string declared_energy_kwh = 13;
  string attested_capacity = 14;
  string attested_energy_kwh = 15;
  string created_at = 16;
}

message CreateFacilityRequest {
  string name = 1;
  string address = 2;
  string country_code = 3;
  GridRegion grid_region = 4;
  FacilityType type = 5;
  string facility_reference = 6;
  string declared_capacity = 7;
  string declared_energy_kwh = 8;
}

message CreateFacilityResponse {
  Facility facility = 1;
  bool replayed = 2;
}

message ListFacilitiesRequest {}

message ListFacilitiesResponse {
  repeated Facility facilities = 1;
}

message GetFacilityRequest {
  string facility_id = 1;
}

message GetFacilityResponse {
  Facility facility = 1;
}
